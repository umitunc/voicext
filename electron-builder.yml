appId: com.voicext.app
productName: VoiceXt
directories:
  output: out/make
  buildResources: build

files:
  - out/main/index.js
  - out/preload/index.js
  - out/renderer/**/*
  - package.json

extraResources:
  - from: bin
    to: bin
    filter:
      - "**/*"
      - "!models/**/*"
  - from: scratch
    to: scratch
    filter:
      - "**/*"

win:
  target:
    - nsis
    - appx
  icon: resources/icon.png
  artifactName: "${productName}-${version}-${arch}.${ext}"
  requestedExecutionLevel: asInvoker

appx:
  identityName: TruncgilTeknoloji.VoiceXT
  publisher: CN=36E5CC36-2B19-4151-A2CF-66EF42CB6EBD
  publisherDisplayName: Truncgil Teknoloji
  applicationId: VoiceXT
  languages:
    - tr-TR
    - en-US

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: VoiceXt
  createDesktopShortcut: true

publish:
  provider: generic
  url: https://git.truncgil.com/truncgit/voicext
